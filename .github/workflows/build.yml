name: build check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "resources/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "eslint.config.js"
      - "postcss.config.js"
      - "tailwind.config.js"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  frontend:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "npm"

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: check types
        run: npm run check-types

      - name: build
        run: npm run build
